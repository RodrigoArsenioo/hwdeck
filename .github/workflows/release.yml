# Push a tag like v1.1.1: this builds the zip and the installer and publishes them as a release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false   # (the build fetches from nuget: no token left in .git/config meanwhile)

      - name: Build
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\fetch-deps.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\pack.ps1

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/HWDeck-*.zip
            dist/HWDeck-*.msi

      - name: Publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $notes = ((Get-Content CHANGELOG.md -Raw) -split '(?m)^## ')[1] -replace '^.*\n', ''
          $notes = $notes.Trim() + "`n`nRun HWDeck-$v.msi to install it, or unzip the zip anywhere and run HWDeck.exe. Windows warns the first time because they aren't signed: More info, then Run anyway.`n"
          [IO.File]::WriteAllText("$PWD\dist\notes.md", $notes)
          gh release create $env:GITHUB_REF_NAME "dist\HWDeck-$v.msi" "dist\HWDeck-$v.zip" dist\SHA256SUMS.txt --title "HW Deck $v" --notes-file dist\notes.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
