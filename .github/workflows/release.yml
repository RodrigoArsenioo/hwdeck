# Push a tag like v1.0.1: this builds the zip and publishes it as a release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\fetch-deps.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\pack.ps1

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/HWDeck-*.zip

      - name: Publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $notes = ((Get-Content CHANGELOG.md -Raw) -split '(?m)^## ')[1] -replace '^.*\n', ''
          $notes = $notes.Trim() + "`n`nUnzip it and run HWDeck.exe. Windows warns the first time because the app isn't signed: More info, then Run anyway.`n"
          [IO.File]::WriteAllText("$PWD\dist\notes.md", $notes)
          gh release create $env:GITHUB_REF_NAME "dist\HWDeck-$v.zip" dist\SHA256SUMS.txt --title "HW Deck $v" --notes-file dist\notes.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
