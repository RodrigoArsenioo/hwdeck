# Builds the browser demo (the page in web\ with demo\demo.js standing in for the app) and publishes it on GitHub
# Pages, at https://rodrigoarsenioo.github.io/hwdeck/. Runs when the page or the demo changes, or by hand.
name: pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'demo/**', 'scripts/build-demo.ps1', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-demo.ps1 _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
